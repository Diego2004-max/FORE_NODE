version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: forenode_db
    environment:
      POSTGRES_USER: forenode_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: forenode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: